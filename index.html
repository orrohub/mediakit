<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORRO — Get Early Access</title>
<meta name="description" content="Orro.art is your trust and provenance based future media workspace. Join the waitlist to be notified when Orro.art launches.">

<style>
/* ── ORRO COLOR PALETTE ── */
:root {

  /* ── ACCENTS ── */
  --red:              #EE1923;
  --orange:           #F1761B;
  --yellow:           #FADE24;
  --gold:             #BABE16;
  --lime:             #96DB3B;
  --green:            #0BA136;
  --teal:             #028D6D;
  --cyan:             #06A6BB;
  --blue:             #1360DD;
  --indigo:           #492ACE;
  --purple:           #601DAD;
  --pink:             #CC22EE;
  --plum:             #CC1960;
  --brown:            #614030;

  /* ── NEUTRALS ── */
  --white:            #FFFFFF;
  --periwinkle:       #C5C6C7;
  --light-grey:       #A4A5A6;
  --grey:             #737578;
  --dark-grey:        #28292C;
  --black:            #000000;

  /* ── DARK THEME ── */
  --bg-primary:       #070808;
  --surface-inner:    #0F0F11;
  --surface:          #18191B;
  --surface-elevated: #202124;
  --surface-outer:    #232325;
  --border-subtle:    #272729;
  --border-inner:     #303033;
  --border-outer:     #37373A;
  --text-dark:        #696969;
  --text-dim:         #A5A8AF;
  --text-main:        #D5D5DD;
  --text-light:       #FFFFFF;
  --fg-menu:          #FFFFFF;
  --bg-menu:          #070808;
  --accent-glow:      #02FACE;
  --accent-hover:     #0ABBA0;
  --accent-surface:   #C0FFEE;
  --accent-surface-inner: #93E7D1;
  --form-heading-fg:  #070808;
  --form-heading-bg:  #FFFFFF;
  --form-cancel-btn:  #1F2024;
  --form-field:       #1F2024;
  --form-heading-bord:#2A2A2C;
  --danger:           #F12222;
  --danger-hover:     #3B2B2B;

  /* ── TRANSITION ── */
  --transition-speed:   0.25s;

}

/* ── LIGHT THEME (kept for parity with the shared palette — this page
   only ever renders in dark, but data-theme="light" on <html> still
   works correctly if it's ever embedded somewhere that sets it) ── */
[data-theme="light"] {
  --bg-primary:       #FDFDFD;
  --surface-inner:    #F2F2F5;
  --surface:          #EAEAEE;
  --surface-elevated: #E0E2E7;
  --surface-outer:    #D5DADF;
  --border-outer:     #C4C2C2;
  --border-inner:     #C2C1C1;
  --border-subtle:    #BEBEBE;
  --text-dark:        #696969;
  --text-dim:         #343538;
  --text-main:        #16161A;
  --text-light:       #000000;
  --fg-menu:          #000000;
  --bg-menu:          #FFFFFF;
  --accent-glow:      #0160CC;
  --accent-hover:     #1241DD;
  --accent-surface:   #0ABBEE;
  --accent-surface-inner: #009ABC;
  --btn-text:         #FFFFFF;
  --form-heading-fg:  #FFFFFF;
  --form-heading-bg:  #070808;
  --form-cancel-btn:  #DBDBDB;
  --form-field:       #F0F4F9;
  --form-heading-bord:#070808;
  --danger:           #F12222;
  --danger-hover:     #E0CDCD;
  --transition-speed:   0.25s;
}

html, body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

* { box-sizing: border-box; }

/* Corbel is a Microsoft-licensed font (ships with Windows/Office) —
   it isn't on Google Fonts and can't legally be self-hosted here, so
   there's no @font-face for it. A visitor on Windows (or who has it
   installed some other way) sees real Corbel; everyone else — macOS,
   Linux, iOS, Android, i.e. most web traffic — falls through to
   Segoe UI, then the platform's own default UI sans-serif. If you
   want everyone to see the same face regardless of OS, the fix is
   swapping this stack for a Google-hosted lookalike (Open Sans and
   Noto Sans are both close to Corbel's proportions) — say the word
   and I'll wire that in instead. */
body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-primary);
    color: var(--text-light);
    font-family: Corbel, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
}

/* ── Logo, top-left ── */
.orro-mark {
    padding: 2rem 2.5rem 0;
}
.orro-mark img {
    width: 44px;
    height: auto;
    display: block;
}

/* ── Centered hero ── */
.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem 4rem;
}

.hero h1 {
    margin: 0 0 1.25rem;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    max-width: 780px;
}

.hero p.lede {
    margin: 0 0 2.25rem;
    max-width: 520px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-dim);
}

/* ── Email form ── */
.waitlist-form {
    width: 100%;
    max-width: 420px;
    text-align: left;
}

.waitlist-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-dim);
}

.waitlist-form input[type="email"] {
    width: 100%;
    padding: 0.9rem 1rem;
    margin-bottom: 0.9rem;
    background: var(--form-field);
    border: 1px solid var(--border-inner);
    border-radius: 10px;
    color: var(--text-light);
    font-family: inherit;
    font-size: 15px;
    transition: border-color var(--transition-speed);
}
.waitlist-form input[type="email"]::placeholder { color: var(--text-dark); }
.waitlist-form input[type="email"]:focus {
    outline: none;
    border-color: var(--accent-glow);
}
.waitlist-form input[type="email"]:disabled { opacity: 0.6; }

.waitlist-form button {
    width: 100%;
    padding: 0.95rem 1rem;
    background: var(--form-heading-bg);
    color: var(--form-heading-fg);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background var(--transition-speed), transform 0.1s;
}
.waitlist-form button:hover:not(:disabled) { background: var(--accent-surface); }
.waitlist-form button:active:not(:disabled) { transform: scale(0.99); }
.waitlist-form button:disabled { opacity: 0.6; cursor: default; }

.waitlist-form button .arrow {
    width: 18px;
    height: 18px;
    flex: none;
    transition: transform var(--transition-speed);
}
.waitlist-form button .arrow path { stroke: currentColor; }
.waitlist-form button:hover:not(:disabled) .arrow { transform: translateX(3px); }

/* ── Status line under the button — counter by default, success/
   error messages swap into the same slot so nothing jumps around. ── */
.status-line {
    margin-top: 1.1rem;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    min-height: 1.2em;
}
.status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 7px;
    vertical-align: middle;
}
.status-line.success { color: var(--accent-glow); }
.status-line.error   { color: var(--danger); }

/* ── Footer ── */
footer {
    padding: 1.5rem 1.5rem 2rem;
    text-align: center;
    font-size: 12px;
    color: var(--text-dark);
}
footer strong { color: var(--text-dim); }
footer .footer-text { font-family: inherit; }

@media (max-width: 640px) {
    .orro-mark { padding: 1.5rem 1.5rem 0; }
    .orro-mark img { width: 36px; }
    .hero { padding: 1.5rem 1.25rem 3rem; }
    .hero h1 { font-size: 36px; }
    .hero p.lede { font-size: 15px; }
}
</style>
</head>

<main class="hero">
    <h1>ORRO CREATIVE<br>PLATFORM</h1>
    <p class="lede">Orro.art is your trust and provenance based future media workspace. Join the waitlist below to be notified when Orro.art launches.</p>

    <form class="waitlist-form" id="waitlistForm" novalidate>
        <label for="emailInput">Your Email</label>
        <input type="email" id="emailInput" name="email" placeholder="Enter your email address" required autocomplete="email">
        <button type="submit" id="submitBtn">
            <span id="submitBtnText" style="font-family: inherit;">Get Early Access</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12H20M20 12L14 6M20 12L14 18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </form>

    <div class="status-line" id="statusLine">
        <span class="status-dot" id="statusDot"></span><span id="statusText">Loading…</span>
    </div>
</main>

<footer><span class="footer-text">&copy; <strong>ORRO</strong> 2026</span></footer>

<script>
/* ──────────────────────────────────────────────────────────────────
   No backend here — this is a static page, so two things that would
   normally be trivial server-side need a workaround:

   1. "Sends an email to contact@orro.art" — a browser can't
      send email directly (no SMTP access), so this posts the address
      to FormSubmit (https://formsubmit.co), a free static-form relay:
      it receives the POST and forwards it on to that inbox, no
      account or server code required on our side.

      ONE-TIME SETUP: the very first real submission, FormSubmit sends
      an "activation" email to contact@orro.art with a confirm
      link — until that link is clicked, submissions are accepted but
      NOT forwarded. Click it once and every submission after that
      arrives automatically.

   2. "Updates count.txt" — a browser genuinely cannot write to a file
      on the server (no filesystem access at all, by design — that's
      not a limitation of this page specifically, no client-side JS
      anywhere can do this without a backend). The closest real
      equivalent is CountAPI (https://countapi.xyz), a free, no-auth
      hosted counter: incrementing it is the "write", reading it back
      is the "count.txt". It's a third-party service with no uptime
      guarantee, not an actual file in your own hosting — if that's
      not good enough for launch, the honest fix is a tiny real
      backend (even a single PHP file with file_put_contents would do
      it) rather than this substitute.
   ────────────────────────────────────────────────────────────────── */

var FORM_ENDPOINT    = 'https://formsubmit.co/ajax/contact@orro.art';
var COUNTER_NAMESPACE = 'orro-art';   // change these two if you want
var COUNTER_KEY        = 'waitlist';  // a different CountAPI bucket
var COUNTER_BASE       = 'https://api.countapi.xyz';

var form       = document.getElementById('waitlistForm');
var emailInput = document.getElementById('emailInput');
var submitBtn  = document.getElementById('submitBtn');
var btnText    = document.getElementById('submitBtnText');
var statusLine = document.getElementById('statusLine');
var statusDot  = document.getElementById('statusDot');
var statusText = document.getElementById('statusText');

function formatCount(n) {
    return n.toLocaleString() + ' User' + (n === 1 ? '' : 's') + ' Waiting';
}

function showCounterLine(n) {
    statusLine.className = 'status-line';
    statusDot.style.display = '';
    statusText.textContent = formatCount(n);
}

function showMessage(text, kind) {
    statusLine.className = 'status-line ' + (kind || '');
    statusDot.style.display = 'none';
    statusText.textContent = text;
}

var _lastKnownCount = 0;

// Current count, read-only (GET /get — does not increment).
fetch(COUNTER_BASE + '/get/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY)
    .then(function(res) { return res.json(); })
    .then(function(data) {
        _lastKnownCount = (data && typeof data.value === 'number') ? data.value : 0;
        showCounterLine(_lastKnownCount);
    })
    .catch(function() {
        // Counter service unreachable — the form itself still works,
        // just hide the line rather than show a broken "0 Users".
        statusLine.style.display = 'none';
    });

function isValidEmail(value) {
    // Deliberately simple — just enough to catch an empty/obviously
    // malformed address before it goes anywhere; real validation
    // happens when the address actually gets used.
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

form.addEventListener('submit', function(e) {
    e.preventDefault();

    var email = emailInput.value.trim();
    if (!isValidEmail(email)) {
        showMessage('Please enter a valid email address.', 'error');
        emailInput.focus();
        return;
    }

    submitBtn.disabled = true;
    emailInput.disabled = true;
    btnText.textContent = 'Sending…';

    fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
            email: email,
            _subject: 'New ORRO waitlist signup',
            _template: 'table',
        }),
    })
        .then(function(res) {
            if (!res.ok) throw new Error('FormSubmit returned ' + res.status);
            return res.json();
        })
        .then(function() {
            // Email relay succeeded — now bump the counter (this IS
            // the "write", see the header note above) and show the
            // new total.
            return fetch(COUNTER_BASE + '/hit/' + COUNTER_NAMESPACE + '/' + COUNTER_KEY)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    _lastKnownCount = (data && typeof data.value === 'number') ? data.value : (_lastKnownCount + 1);
                })
                .catch(function() {
                    // Email still went through even if the counter
                    // service is down — don't block the success state
                    // on it, just estimate forward by one.
                    _lastKnownCount = _lastKnownCount + 1;
                });
        })
        .then(function() {
            form.style.display = 'none';
            showMessage('You\'re on the list — we\'ll be in touch.', 'success');
            setTimeout(function() { showCounterLine(_lastKnownCount); }, 2600);
        })
        .catch(function(err) {
            console.error('[waitlist submit]', err);
            showMessage('Something went wrong — please try again.', 'error');
            submitBtn.disabled = false;
            emailInput.disabled = false;
            btnText.textContent = 'Get Early Access';
        });
});
</script>
